<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Emilly Fernandes — GitHub profile introduction</title>
  <desc id="desc">An animated terminal loading sequence followed by a welcome screen and Emilly's developer profile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#67D5E8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Courier New', monospace; }
      .scene { opacity: 0; }
      .terminal { animation: showTerminal 12s forwards; }
      .welcome { animation: showWelcome 12s forwards; }
      .profile { animation: showProfile 12s forwards; }
      @keyframes showTerminal {
        0%, 3% { opacity: 0; }
        7%, 29% { opacity: 1; }
        34%, 100% { opacity: 0; }
      }
      @keyframes showWelcome {
        0%, 32% { opacity: 0; }
        37%, 59% { opacity: 1; }
        64%, 100% { opacity: 0; }
      }
      @keyframes showProfile {
        0%, 62% { opacity: 0; }
        67%, 100% { opacity: 1; }
      }
      .cursor { animation: blink 0.8s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      .progress { transform-origin: left; animation: load 3.2s ease-in-out infinite; }
      @keyframes load { 0% { transform: scaleX(0.03); } 75%, 100% { transform: scaleX(0.91); } }
      .line1 { animation: type1 12s steps(1) infinite; }
      @keyframes type1 { 0%, 10% { opacity: 0; } 12%, 100% { opacity: 1; } }
      .line2 { animation: type2 12s steps(1) infinite; }
      @keyframes type2 { 0%, 17% { opacity: 0; } 19%, 100% { opacity: 1; } }
      .line3 { animation: type3 12s steps(1) infinite; }
      @keyframes type3 { 0%, 23% { opacity: 0; } 25%, 100% { opacity: 1; } }
      .welcome-title { animation: rise 12s ease infinite; }
      .welcome-sub { animation: riseSub 12s ease infinite; }
      @keyframes rise { 0%, 34% { opacity: 0; transform: translateY(12px); } 40%, 59% { opacity: 1; transform: translateY(0); } 64%, 100% { opacity: 0; transform: translateY(-8px); } }
      @keyframes riseSub { 0%, 40% { opacity: 0; transform: translateY(10px); } 46%, 59% { opacity: 1; transform: translateY(0); } 64%, 100% { opacity: 0; transform: translateY(-6px); } }
      .profile-name { animation: nameIn 12s ease forwards; }
      .profile-role { animation: roleIn 12s ease forwards; }
      .profile-tags { animation: tagsIn 12s ease forwards, softPulse 3.5s ease-in-out 12s infinite; }
      @keyframes nameIn { 0%, 64% { opacity: 0; transform: translateY(12px); } 70%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes roleIn { 0%, 70% { opacity: 0; } 76%, 100% { opacity: 1; } }
      @keyframes tagsIn { 0%, 76% { opacity: 0; } 82%, 100% { opacity: 1; } }
      .profile-rule { animation: ruleGlow 3.5s ease-in-out 12s infinite; }
      @keyframes ruleGlow { 0%, 100% { opacity: .55; stroke-width: 2; } 50% { opacity: 1; stroke-width: 3.5; } }
      @keyframes softPulse { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
    </style>
  </defs>

  <rect width="1000" height="260" rx="10" fill="url(#background)"/>
  <rect x="1" y="1" width="998" height="258" rx="9" fill="none" stroke="#263244" stroke-width="1.5"/>
  <circle cx="22" cy="20" r="4" fill="#A3E635" opacity=".75"/>
  <circle cx="38" cy="20" r="4" fill="#67D5E8" opacity=".75"/>
  <circle cx="54" cy="20" r="4" fill="#8B7CFF" opacity=".75"/>

  <!-- Scene 1: terminal loading -->
  <g class="scene terminal">
    <text x="28" y="67" font-size="17" fill="#A3E635">emilly@github:~$</text>
    <text x="205" y="67" font-size="17" fill="#F8FAFC">./load-profile.sh --verbose</text>
    <text x="28" y="105" font-size="20" font-weight="bold" fill="#F8FAFC">Loading Emilly's profile...</text>
    <rect x="28" y="124" width="944" height="25" rx="5" fill="#273244"/>
    <rect class="progress" x="28" y="124" width="944" height="25" rx="5" fill="url(#bar)" filter="url(#glow)"/>
    <g font-size="14" fill="#91A3B8">
      <text class="line1" x="28" y="177">Initializing developer environment...</text>
      <text class="line2" x="28" y="202">Fetching projects and contributions...</text>
      <text class="line3" x="28" y="227">Preparing GitHub profile display...</text>
    </g>
    <rect class="cursor" x="298" y="214" width="8" height="15" fill="#A3E635"/>
  </g>

  <!-- Scene 2: welcome -->
  <g class="scene welcome" text-anchor="middle">
    <text class="welcome-title" x="500" y="119" font-family="Arial, sans-serif" font-size="43" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">Welcome to Emilly's GitHub Profile</text>
    <text class="welcome-sub" x="500" y="164" font-size="21" fill="#A3E635">Explore my projects and contributions</text>
    <path d="M330 188 H670" stroke="#A3E635" stroke-width="2" opacity=".65"/>
  </g>

  <!-- Scene 3: personal introduction -->
  <g class="scene profile" text-anchor="middle">
    <text class="profile-name" x="500" y="104" font-family="Arial, sans-serif" font-size="39" font-weight="700" letter-spacing="1" fill="#F8FAFC">EMILLY FERNANDES</text>
    <path class="profile-rule" d="M300 124 H700" stroke="#A3E635" stroke-width="2" opacity=".8"/>
    <text class="profile-role" x="500" y="160" font-family="Arial, sans-serif" font-size="21" fill="#67D5E8">Computer Science Student | Technology Intern</text>
    <text class="profile-tags" x="500" y="198" font-size="16" letter-spacing="2" fill="#A3E635">PYTHON  ·  SQL  ·  DEVELOPMENT  ·  AUTOMATION</text>
  </g>
</svg>
